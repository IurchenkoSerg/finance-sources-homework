<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Отчёт о прибыли из двух серверных источников"
    />
    <title>Finance Sources</title>
  </head>
  <body>
    <main class="page">
      <nav class="toolbar" aria-label="Page settings">
        <div class="control-group">
          <span class="control-label" data-i18n="languageLabel">Язык</span>
          <div class="segmented-control" role="group" aria-label="Language">
            <button class="segment" type="button" data-language="ru">RU</button>
            <button class="segment" type="button" data-language="en">EN</button>
          </div>
        </div>
        <div class="control-group">
          <span class="control-label" data-i18n="themeLabel">Тема</span>
          <div class="segmented-control" role="group" aria-label="Theme">
            <button class="segment theme-icon" type="button" data-theme-value="light" aria-label="Light theme">☀</button>
            <button class="segment theme-icon" type="button" data-theme-value="dark" aria-label="Dark theme">☾</button>
          </div>
        </div>
      </nav>

      <header class="hero">
        <p class="eyebrow" data-i18n="eyebrow">Домашнее задание · 23.07</p>
        <h1 data-i18n="title">Отчёт о прибыли</h1>
        <p class="subtitle" data-i18n="subtitle">
          Данные загружаются из двух API. Валюты считаются отдельно и никогда
          не смешиваются.
        </p>
        <button id="refresh-button" type="button" data-i18n="refresh">
          Обновить данные
        </button>
      </header>

      <section id="status" class="status" aria-live="polite">
        Загрузка данных…
      </section>
      <section id="summary" class="summary" aria-label="Итог по валютам"></section>
      <section id="sources" class="sources" aria-label="Источники данных"></section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
